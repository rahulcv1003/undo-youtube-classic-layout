<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Sanitised structural fixture</title><style>body{margin:0;font:14px system-ui}ytd-watch-flexy{display:block}#player{height:400px}ytd-watch-metadata{display:block;height:120px}yt-lockup-view-model{display:block}#chat-container:empty{display:none}#related{min-height:500px}ytd-comments#comments:not([hidden]){display:block;min-height:100px}ytd-engagement-panel-section-list-renderer{display:none}ytd-engagement-panel-section-list-renderer #content{min-height:100px}</style></head><body>
<!-- Reduced structural fixture, transcribed from live DOM inspection. All text,
     URLs, IDs referring to videos and user attributes have been removed.
     Not a replacement for the full scenario snapshot matrix. -->
<ytd-watch-flexy fixed-default-panels side-rail-dismissible-panels split-scroll using-fixed-panel default-layout is-two-columns_>
  <div id="full-bleed-container"><div id="player-full-bleed-container"></div></div>
  <div id="columns">
    <div id="primary"><div id="primary-inner"><div id="player"></div><div id="below">
      <div id="shopping-timely-shelf"></div><div id="inline-panels"></div>
      <div><div id="alerts"></div><div id="messages"></div><ytd-watch-metadata hide-description enable-top-right-watch-metadata><div id="above-the-fold"><div id="title-row"></div><div id="top-row"><button-view-model class="you-chat-entrypoint-button"><button aria-label="Ask">Ask</button></button-view-model><input aria-label="Normal search"></div></div></ytd-watch-metadata></div>
      <div><div id="related"><ytd-watch-next-secondary-results-renderer><div id="items"><ytd-item-section-renderer is-grid-view-enabled secondary-grid-columns="2"><div id="contents">
        <yt-lockup-view-model><div class="ytLockupViewModelHost ytLockupViewModelVertical"><a class="ytLockupViewModelContentImage"></a><div class="ytLockupViewModelMetadata"></div></div></yt-lockup-view-model>
      </div></ytd-item-section-renderer></div></ytd-watch-next-secondary-results-renderer></div><ytd-comments id="comments" hidden><ytd-item-section-renderer id="sections"></ytd-item-section-renderer></ytd-comments></div>
    </div></div></div>
    <div id="secondary"><div id="secondary-split-scroll-spacer"></div><div id="secondary-inner"><div id="panels">
      <ytd-engagement-panel-section-list-renderer target-id="PAyouchat" visibility="ENGAGEMENT_PANEL_VISIBILITY_HIDDEN"><div id="header"></div><div id="content"></div><div id="footer"></div></ytd-engagement-panel-section-list-renderer>
      <ytd-engagement-panel-section-list-renderer target-id="engagement-panel-comments-section" visibility="ENGAGEMENT_PANEL_VISIBILITY_HIDDEN"><div id="header"></div><div id="content"><ytd-section-list-renderer><div id="contents"><ytd-comments engagement-panel><ytd-item-section-renderer id="sections"><div id="contents"><ytd-continuation-item-renderer is-initial-load></ytd-continuation-item-renderer></div></ytd-item-section-renderer></ytd-comments></div></ytd-section-list-renderer></div><div id="footer"></div></ytd-engagement-panel-section-list-renderer>
      <ytd-engagement-panel-section-list-renderer target-id="engagement-panel-structured-description" visibility="ENGAGEMENT_PANEL_VISIBILITY_HIDDEN"><div id="header"></div><div id="content"><ytd-structured-description-content-renderer></ytd-structured-description-content-renderer></div><div id="footer"></div></ytd-engagement-panel-section-list-renderer>
      <ytd-engagement-panel-section-list-renderer target-id="engagement-panel-macro-markers-auto-chapters" visibility="ENGAGEMENT_PANEL_VISIBILITY_HIDDEN"><div id="header"></div><div id="content"><ytd-macro-markers-list-renderer></ytd-macro-markers-list-renderer></div></ytd-engagement-panel-section-list-renderer>
    </div><div id="chat-container"></div><ytd-playlist-panel-renderer id="playlist" hidden></ytd-playlist-panel-renderer><div id="persistent-panel-container"></div></div></div>
  </div><div id="fixed-side-menu"><yt-side-rail-view-model></yt-side-rail-view-model></div>
</ytd-watch-flexy></body></html>
