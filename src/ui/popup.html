<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Undo</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M9 5 3 11l6 6M4 11h10a6 6 0 0 1 0 12"
            transform="translate(0 -3)"
            stroke="currentColor"
            stroke-width="2"
          /></svg
        ><span data-i18n="extShortName"></span>
      </div>
      <div class="switch-row">
        <span id="switch-label" data-i18n="classicLayout"></span
        ><button
          id="enabled"
          type="button"
          role="switch"
          aria-checked="true"
          aria-labelledby="switch-label"
          disabled
        >
          <span class="thumb" aria-hidden="true"></span>
        </button>
      </div>
      <div class="page-status">
        <svg
          class="status-icon"
          viewBox="0 0 20 20"
          fill="none"
          aria-hidden="true"
        >
          <circle
            cx="10"
            cy="10"
            r="7.25"
            stroke="currentColor"
            stroke-width="1.5"
          />
          <path
            class="status-check"
            d="m6.5 10 2.3 2.3 4.7-4.6"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            class="status-info"
            d="M10 9v4M10 6.5v.1"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
          />
        </svg>
        <p
          id="status"
          role="status"
          aria-live="polite"
          data-i18n="statusLoading"
        ></p>
      </div>
      <p class="muted info" data-i18n="alreadyClassicInfo"></p>
      <nav>
        <button class="options-row" id="options">
          <span class="options-name"
            ><svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path
                d="M3 5h14M3 10h14M3 15h14"
                stroke="currentColor"
                stroke-width="1.4"
                stroke-linecap="round"
              />
              <path
                d="M7 3v4M13 8v4M8 13v4"
                stroke="currentColor"
                stroke-width="2.4"
                stroke-linecap="round"
              /></svg
            ><span data-i18n="options"></span></span
          ><svg
            class="chevron"
            viewBox="0 0 20 20"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="m8 6 4 4-4 4"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </nav>
      <footer class="popup-footer">
        <button class="text-button" id="report" data-i18n="broken"></button
        ><span id="version"></span>
      </footer>
      <div id="rating" hidden>
        <p data-i18n="rating"></p>
        <a id="rate" data-i18n="rate"></a
        ><button class="text-button" id="dismiss" data-i18n="dismiss"></button>
      </div>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
